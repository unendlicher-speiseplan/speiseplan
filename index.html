<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Unendlicher Speiseplan</title>
<style>
/* Layout: eine Spalte, sticky Kopf, feste Tab-Leiste unten; Karten nur für Rezepte, Plätze und Prüfungen */
:root {
  --bg: #edf3f1; --surface: #ffffff; --surface2: #e2ebe8; --ink: #14211e; --muted: #556a66; --line: #c9d7d3;
  --accent: #0b7a86; --accent-ink: #ffffff; --ice: #d3eaf2; --ok: #1d7a44; --warn: #a4530a; --bad: #b3261e;
  --warn-bg: #fbe9d5; --bad-bg: #fbdcd9; --ok-bg: #d8efe1;
  --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1513; --surface: #16211e; --surface2: #1e2c28; --ink: #e4eeeb; --muted: #92a9a4; --line: #2b3c37;
    --accent: #52c4cf; --accent-ink: #062226; --ice: #1b3540; --ok: #5cc687; --warn: #ebaa5a; --bad: #f28d85;
    --warn-bg: #3a2a14; --bad-bg: #3d1f1c; --ok-bg: #173325; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1513; --surface: #16211e; --surface2: #1e2c28; --ink: #e4eeeb; --muted: #92a9a4; --line: #2b3c37;
  --accent: #52c4cf; --accent-ink: #062226; --ice: #1b3540; --ok: #5cc687; --warn: #ebaa5a; --bad: #f28d85;
  --warn-bg: #3a2a14; --bad-bg: #3d1f1c; --ok-bg: #173325; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 15.5px; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.topin { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; min-height: 40px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; min-height: 32px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

.view { padding-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-height: 40px; min-width: 0;
}
textarea { min-height: 84px; resize: vertical; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; min-width: 0; }
.check input { margin-top: 3px; accent-color: var(--accent); flex: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.badge { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--ink); white-space: nowrap; }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.ice { background: var(--ice); }
.badges { display: flex; gap: 5px; flex-wrap: wrap; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.panel.ice { background: var(--ice); border-color: transparent; }
details.panel > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: "+"; font-family: var(--mono); color: var(--muted); }
details.panel[open] > summary::after { content: "–"; }
details.panel[open] > summary { margin-bottom: 12px; }

.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; cursor: pointer; min-width: 0; }
.rcard:hover { border-color: var(--accent); }
.rtop { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.rmeta { font-size: 12.5px; color: var(--muted); }
.fav { border: 0; background: transparent; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 4px; color: var(--muted); flex: none; }
.fav.on { color: #d99a13; }
.list { display: flex; flex-direction: column; gap: 10px; }

.macros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.macro { background: var(--surface2); border-radius: 10px; padding: 8px 6px; text-align: center; }
.macro b { display: block; font-family: var(--mono); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.macro span { font-size: 11px; color: var(--muted); }

.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(5, 12, 10, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card { background: var(--bg); width: 100%; max-width: 760px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 720px) { .sheet { align-items: center; } .sheet-card { border-radius: 16px; max-height: 88%; } }

.svtab { margin: 8px 0; } .svtab th, .svtab td { padding: 4px 8px; text-align: left; border-bottom: 1px solid var(--line, rgba(128,128,128,.3)); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; color: var(--muted); font-weight: 500; letter-spacing: .03em; text-transform: uppercase; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll-x { overflow-x: auto; }

.bar { height: 8px; background: var(--surface2); border-radius: 6px; overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.bar > i.warn { background: var(--warn); }
.bar > i.bad { background: var(--bad); }
.bar > i.ok { background: var(--ok); }

.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 0; font-weight: 600; font-size: 13px; cursor: pointer; text-align: center; position: relative; }
.day.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.day i { display: block; width: 5px; height: 5px; border-radius: 50%; margin: 3px auto 0; background: transparent; }
.day i.f { background: var(--ok); }
.day.on i.f { background: var(--accent-ink); }

.slot { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.slot .lbl { text-transform: uppercase; letter-spacing: .06em; }

.chk { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); }
.chk input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.chk.done span { text-decoration: line-through; color: var(--muted); }
.chk .amt { margin-left: auto; font-family: var(--mono); font-size: 13px; white-space: nowrap; padding-left: 8px; }
.cat { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

.note { font-size: 13px; color: var(--muted); }
.err { color: var(--bad); font-size: 13.5px; }
.checks { display: flex; flex-direction: column; gap: 5px; }
.crow { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.crow .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
.crow .dot.ok { background: var(--ok-bg); color: var(--ok); }
.crow .dot.warn { background: var(--warn-bg); color: var(--warn); }
.crow .dot.fail { background: var(--bad-bg); color: var(--bad); }
.crow small { display: block; color: var(--muted); font-size: 12.5px; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.pre { white-space: pre-wrap; font-size: 14px; line-height: 1.55; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar-in { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; width: 100%; max-width: 760px; }
.tab { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: 11px; font-weight: 500; color: var(--muted); cursor: pointer; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent); background: var(--surface2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 40; max-width: 90%; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
@media (max-width: 420px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ===== Erweiterungen v2 ===== */
body.lock { overflow: hidden; }
.sheet-card:focus { outline: none; }
.btn.sq { padding: 0; min-width: 32px; width: 32px; justify-content: center; font-size: 18px; line-height: 1; }
.linkbtn { border: 0; background: transparent; color: var(--accent); font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; background: var(--surface2); border-radius: 10px; padding: 3px; }
.segb { border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; min-height: 38px; }
.segb.on { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.sel-s { width: auto; min-width: 96px; }
.panel.warnp { background: var(--warn-bg); border-color: transparent; }
.panel.donep, .slot.donep { opacity: .8; }
.ename { font-weight: 600; overflow-wrap: anywhere; }
.alist, .elist { display: flex; flex-direction: column; }
.arow, .srow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 10px 2px; cursor: pointer; min-height: 48px; }
.srow { border-bottom-color: var(--line); }
.arow .plus { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 18px; flex: none; }
.srow2 { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.erow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ekcal { min-width: 44px; text-align: right; }
.mealp .elist { margin-top: 4px; }
.datenav { display: flex; align-items: center; gap: 8px; }
.datebtn { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 16px; cursor: pointer; min-height: 40px; }
.ringcard { display: flex; align-items: center; gap: 16px; }
.ringbox { position: relative; width: 130px; height: 130px; flex: none; }
.ringsvg { width: 130px; height: 130px; display: block; }
.rbg { fill: none; stroke: var(--surface2); stroke-width: 12; }
.rfg { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; }
.rfg.over { stroke: var(--bad); }
.ringc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ringc b { font-size: 26px; font-weight: 500; line-height: 1.1; }
.ringc span { font-size: 11.5px; color: var(--muted); }
.ringside { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.ringside > div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.ringside b { font-size: 16px; font-weight: 500; }
.mrow { display: flex; flex-direction: column; gap: 4px; }
.chart { width: 100%; height: auto; display: block; }
.cb { fill: var(--accent); }
.cb.over { fill: var(--bad); }
.cb.none { fill: var(--surface2); }
.ct { fill: var(--muted); font-size: 10px; font-family: var(--mono); }
.cgoal { stroke: var(--muted); stroke-dasharray: 4 3; stroke-width: 1; }
.wline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.wdot { fill: var(--accent); }
.star { border: 0; background: transparent; font-size: 26px; line-height: 1; cursor: pointer; color: var(--line); padding: 2px 4px; }
.star.on { color: #d99a13; }
.stk { display: inline-block; width: 18px; font-size: 12px; }
.stk.ok { color: var(--ok); } .stk.warn { color: var(--warn); } .stk.none { color: var(--muted); }
.sub2 { display: block; color: var(--muted); font-size: 12px; }
.gin { width: 84px; min-height: 34px; padding: 5px 8px; text-align: right; font-family: var(--mono); }
.lotrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.irow { display: flex; flex-direction: column; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
.statuslist { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
input[type=file] { font-size: 13px; max-width: 100%; }
.slot select { font-size: 14px; }
.sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
@media (max-width: 380px) { .ringcard { flex-direction: column; align-items: stretch; } .ringbox { margin: 0 auto; } }
.tab { min-width: 0; font-size: 10.5px; }
.shoprow { align-items: center; padding: 3px 0; }
.shoprow .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.shoprow .grow.done { text-decoration: line-through; color: var(--muted); }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
pre.label { background: var(--surface2); border-radius: 8px; padding: 10px 12px; margin: 0; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; }
.rcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Saison */
.sc { font-weight: 700; font-size: 11px; text-align: center; }
.sc.F { background: #2d865b; color: #fff; } .sc.G { background: #6d9fad; color: #fff; } .sc.L { background: #f6cf85; color: #4a3410; } .sc.I { background: #d9eaf6; color: #27506b; } .sc.N { background: #e6ebea; color: #6b7a77; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sc.N { background: #2a3836; color: #93a5a1; } :root:not([data-theme="light"]) .sc.I { background: #2b4558; color: #cfe3f1; } }
:root[data-theme="dark"] .sc.N { background: #2a3836; color: #93a5a1; } :root[data-theme="dark"] .sc.I { background: #2b4558; color: #cfe3f1; }
.heat { border-collapse: separate; border-spacing: 0; font-size: 12.5px; width: max-content; }
.heat thead th { font-size: 10px; font-weight: 600; color: var(--muted); padding: 0 0 4px; text-align: center; min-width: 20px; font-size: 8.5px; letter-spacing: -.02em; }
.heat thead th.hn { text-align: left; }
.heat th, .heat td { border-bottom: 0; }
.heat th[scope="row"] { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding: 0 4px 0 0; white-space: nowrap; font-weight: 500; font-size: 12.5px; color: var(--ink); text-transform: none; letter-spacing: 0; vertical-align: middle; height: 28px; width: 92px; max-width: 92px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.heat td.sc { width: 18px; min-width: 18px; font-size: 10px; height: 26px; padding: 0; text-align: center; vertical-align: middle; border: 1px solid var(--surface); border-bottom: 1px solid var(--surface); }
.heat .cur { box-shadow: inset 0 0 0 2px var(--ink); }
.heat thead th.cur { box-shadow: none; color: var(--ink); text-decoration: underline; }
.heat tr.hgrp th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 0 4px; position: static; background: transparent; }
.cellb { width: 100%; height: 100%; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; padding: 0; }
.mstrip { display: inline-flex; gap: 1px; vertical-align: middle; }
.mstrip i.sc { display: inline-block; width: 11px; height: 16px; }
.mstrip i.sc.cur { box-shadow: 0 0 0 1.5px var(--ink); position: relative; z-index: 1; }
i.sc.lg { display: inline-block; width: 16px; height: 16px; line-height: 16px; border-radius: 3px; font-style: normal; vertical-align: -3px; }
.badge.sm { font-size: 10.5px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }

.mgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.mgrid .chip { padding: 7px 0; text-align: center; }
.sdet td { vertical-align: middle; }
</style>

</head>
<body>
<header class="top"><div class="wrap topin"><div style="min-width:0"><h1>Unendlicher Speiseplan</h1><p class="sub mono" id="sub">Wird geladen …</p></div></div></header>
<main class="wrap view" id="view"></main>
<nav class="tabbar" aria-label="Bereiche"><div class="tabbar-in" id="tabs"></div></nav>
<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheet-card" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
/* ===== Daten & Logik (ohne DOM, testbar) ===== */
const ALLERGENE = {
  gluten: 'Glutenhaltiges Getreide', krebs: 'Krebstiere', ei: 'Eier', fisch: 'Fisch', erdnuss: 'Erdnüsse',
  soja: 'Soja', milch: 'Milch', schale: 'Schalenfrüchte', sellerie: 'Sellerie', senf: 'Senf',
  sesam: 'Sesam', sulfit: 'Schwefeldioxid/Sulfite', lupine: 'Lupinen', weich: 'Weichtiere'

/* ---------- Hilfsfunktionen ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function norm(s) {
  return String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
}
function round1(x) { return Math.round(x * 10) / 10; }

function exclusionHits(text, extra) {
  const n = norm(text);
  const sqLines = n.split('\n').map(l => l.replace(/[\s\-_.]/g, ''));
  const keys = EXCL_KEYS.concat((extra || []).map(k => norm(k).trim()).filter(Boolean));
  const hits = [];
  keys.forEach(k => {
    const kk = k.replace(/[\s\-_.]/g, '');
    const re = new RegExp('(^|[^a-z])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    let hit = re.test(n);
    if (!hit && (EXCL_COMPOUND.includes(k) || k.includes(' '))) hit = sqLines.some(l => l.includes(kk));
    if (hit && !hits.includes(k)) hits.push(k);
  });
  return hits;
}
function recipeTexts(r) {
  const parts = [r.name, r.tips, r.storage, r.reheat, (r.freeze && r.freeze.note) || ''];
  (r.tags || []).forEach(t => parts.push(t));
  parts.push(r.cuisine || '', r.src || '', r.origin || '');
  (r.spices || []).forEach(id => { parts.push(id); if (typeof SMAP !== 'undefined' && SMAP[id]) parts.push(SMAP[id].name); });
  (r.steps || []).forEach(t => parts.push(t));
  (r.ing || []).forEach(i => { parts.push(i[0]); if (ZMAP[i[0]]) parts.push(ZMAP[i[0]].name); });
  if (r.dutch) Object.values(r.dutch).forEach(v => parts.push(v));
  return parts.join(' \n ');
}
function recipeExclusionHits(r, extra) { return exclusionHits(recipeTexts(r), extra); }

function calcRecipe(r) {
  const tot = { kcal: 0, p: 0, c: 0, f: 0, g: 0 };
  const rows = [];
  const missing = [];
  (r.ing || []).forEach(([id, g]) => {
    const z = ZMAP[id];
    if (!z) { missing.push(id); return; }
    const k = g / 100;
    const row = { id, name: z.name, g, kcal: z.kcal * k, p: z.p * k, c: z.c * k, f: z.f * k, noMacro: z.noMacro };
    rows.push(row);
    tot.kcal += row.kcal; tot.p += row.p; tot.c += row.c; tot.f += row.f; tot.g += g;
  });
  const n = Math.max(1, r.servings || 1);
  const pp = { kcal: Math.round(tot.kcal / n), p: round1(tot.p / n), c: round1(tot.c / n), f: round1(tot.f / n), g: Math.round(tot.g / n) };
  return { tot, pp, rows, missing };
}
function derive(r) {
  const al = new Set(); const intol = new Set(); const fodIng = []; let his = 0;
  (r.ing || []).forEach(([id]) => {
    const z = ZMAP[id]; if (!z) return;
    z.al.forEach(a => al.add(a));
    if (z.lak) intol.add('laktose');
    if (z.fod) { intol.add('fodmap'); fodIng.push(z.name); }
    if (z.hul) intol.add('huelsen');
    if (z.fr) intol.add('fruktose');
    if (z.his === 2) his = 2; else if (z.his === 1 && his < 1) his = 1;
  });
  if (his === 2) intol.add('histamin');
  (r.spices || []).forEach(id => { const sp = typeof SMAP !== 'undefined' && SMAP[id]; if (!sp) return; sp.al.forEach(a => al.add(a)); if (sp.fod) { intol.add('fodmap'); fodIng.push(sp.name); } });
  const hisIng = (r.ing || []).map(([id]) => ZMAP[id]).filter(z => z && z.his >= 1).map(z => z.name);
  return { al: [...al], intol: [...intol], his, hisLabel: ['niedrig', 'mittel', 'erhöht'][his], hisIng, fodIng };
}
function conflicts(r, profile) {
  const d = derive(r); const out = [];
  d.al.forEach(a => { if ((profile.avoidAllergens || []).includes(a)) out.push('Allergen: ' + ALLERGENE[a]); });
  d.intol.forEach(u => { if ((profile.avoidIntol || []).includes(u)) out.push('Unverträglichkeit: ' + UNVERTR[u]); });
  if ((profile.avoidIntol || []).includes('histamin') && d.his === 1) out.push('Histamin: mittleres Risiko');
  return out;
}
function mealType(r) { return MAIN_MEALS.includes(r.meal) ? 'main' : (r.meal === 'Frühstück' ? 'breakfast' : 'snack'); }
function slotFits(slot, r) {
  if (slot === 'f') return r.meal === 'Frühstück';
  if (slot === 's') return r.meal === 'Snack';
  return MAIN_MEALS.includes(r.meal);
}

function energyCheck(r) {
  const c = calcRecipe(r).pp;
  const calc = 4 * c.p + 4 * c.c + 9 * c.f;
  const diff = Math.abs(c.kcal - calc);
  return { ok: diff <= 20 || diff / Math.max(1, c.kcal) <= 0.15, calc: Math.round(calc), kcal: c.kcal };
}
function ingredientEnergyIssues() {
  return ZUTATEN.filter(z => !z.noMacro).filter(z => {
    const calc = 4 * z.p + 4 * z.c + 9 * z.f + ((z.bls && z.bls.e) || 0); const d = Math.abs(z.kcal - calc);
    return !(d <= 8 || d / Math.max(1, z.kcal) <= 0.15);
  }).map(z => z.name);
}

/* Vollständige Prüfung eines Rezepts (Seed oder KI) */
function validateRecipe(r, library, profile, targets) {
  const checks = [];
  const add = (name, ok, detail, level) => checks.push({ name, ok, detail: detail || '', level: level || (ok ? 'ok' : 'fail') });
  const cr = calcRecipe(r);
  add('Pflichtfelder', !!(r.name && MEALS.includes(r.meal) && GRUPPEN.includes(r.group) && r.servings >= 1 && r.servings <= 12 && Array.isArray(r.ing) && r.ing.length >= 3 && Array.isArray(r.steps) && r.steps.length >= 3 && r.prep >= 0 && r.cook >= 0), 'Name, Kategorie, Portionen, ≥3 Zutaten, ≥3 Schritte, Zeiten');
  add('Zutaten im Stamm', cr.missing.length === 0, cr.missing.length ? 'Unbekannt: ' + cr.missing.join(', ') : 'Alle Zutaten haben Nährwert-Referenzen');
  const badSp = (r.spices || []).filter(id => !(typeof SMAP !== 'undefined' && SMAP[id]));
  add('Gewürze im Stamm', badSp.length === 0, badSp.length ? 'Unbekannt: ' + badSp.join(', ') : ((r.spices || []).length + ' Gewürze zugeordnet'));
  const badAmt = (r.ing || []).filter(([id, g]) => !(g > 0 && g <= 3000));
  add('Mengen positiv & plausibel', badAmt.length === 0, badAmt.length ? 'Auffällige Menge bei: ' + badAmt.map(x => x[0]).join(', ') : '');
  const ex = recipeExclusionHits(r, profile && profile.excl);
  add('Persönliche Ausschlüsse', ex.length === 0, ex.length ? 'Treffer: ' + ex.join(', ') : 'Keine Treffer (Ananas, Süßkartoffel, Batate + Varianten)');
  const en = energyCheck(r);
  add('Energie-Plausibilität', en.ok, en.kcal + ' kcal vs. ' + en.calc + ' kcal aus Makros');
  const gw = cr.pp.g;
  const lo = r.meal === 'Snack' ? 80 : 150; const hi = 1100;
  add('Portionsgewicht', gw >= lo && gw <= hi, gw + ' g pro Portion', (gw >= lo && gw <= hi) ? 'ok' : 'warn');
  const total = (r.prep || 0) + (r.cook || 0);
  add('Zeitrechnung', total > 0 || r.meal === 'Snack', 'Gesamtdauer ' + total + ' Min.', (total > 0 || r.meal === 'Snack') ? 'ok' : 'warn');
  const lib = (library || []).filter(x => x.id !== r.id);
  const nn = norm(r.name);
  const dupName = lib.find(x => norm(x.name) === nn);
  const setA = new Set((r.ing || []).map(i => i[0]).filter(i => i !== 'gewuerze'));
  let best = 0; let bestName = '';
  lib.forEach(x => {
    const setB = new Set((x.ing || []).map(i => i[0]).filter(i => i !== 'gewuerze'));
    const inter = [...setA].filter(i => setB.has(i)).length;
    const uni = new Set([...setA, ...setB]).size || 1;
    if (inter / uni > best) { best = inter / uni; bestName = x.name; }
  });
  add('Dubletten', !dupName && best < 0.8, dupName ? 'Name existiert bereits' : (best >= 0.8 ? 'Sehr ähnlich zu: ' + bestName : 'Keine Dublette erkannt'), (!dupName && best < 0.8) ? 'ok' : (dupName ? 'fail' : 'warn'));
  if (targets) {
    if (targets.maxKcal) add('Ziel: max. kcal/Portion', cr.pp.kcal <= targets.maxKcal, cr.pp.kcal + ' kcal (Ziel ≤ ' + targets.maxKcal + ')', cr.pp.kcal <= targets.maxKcal ? 'ok' : 'warn');
    if (targets.minP) add('Ziel: min. Protein/Portion', cr.pp.p >= targets.minP, cr.pp.p + ' g (Ziel ≥ ' + targets.minP + ')', cr.pp.p >= targets.minP ? 'ok' : 'warn');
  }
  const fz = r.freeze || {};
  const fzOk = !fz.ok || fz.ok === 'nein' || (KAMMERN[fz.block] && fz.months > 0);
  add('Gefrierangaben', fzOk, fz.ok === 'nein' || !fz.ok ? 'Nicht zum Einfrieren vorgesehen' : (fz.block + ' ml, ' + fz.months + ' Monate'));
  if (profile) {
    const cf = conflicts(r, profile);
    add('Mein Profil (Allergene/Unverträglichkeiten)', cf.length === 0, cf.length ? cf.join('; ') : 'Keine Konflikte', cf.length ? 'warn' : 'ok');
  }
  const fails = checks.filter(c => c.level === 'fail').length;
  return { checks, fails, warns: checks.filter(c => c.level === 'warn').length, cr };
}

/* Gesamt-Selbsttest der Bibliothek */
function runQA(library, profile) {
  const res = [];
  const add = (name, ok, detail) => res.push({ name, ok, detail });
  add('Rezeptanzahl', true, library.length + ' Rezepte in der Bibliothek (Ziel 240, noch nicht erreicht)');
  const ids = library.map(r => r.id);
  add('ID-Eindeutigkeit', new Set(ids).size === ids.length, ids.length + ' IDs');
  const names = library.map(r => norm(r.name));
  add('Namens-Eindeutigkeit', new Set(names).size === names.length, '');
  const exBad = library.filter(r => recipeExclusionHits(r, profile.excl).length);
  add('Ausschlüsse in allen Rezepten', exBad.length === 0, exBad.length ? exBad.map(r => r.name).join(', ') : 'Keine Treffer');
  const miss = library.filter(r => calcRecipe(r).missing.length);
  add('Zutaten im Stamm', miss.length === 0, miss.length ? miss.map(r => r.name).join(', ') : 'Alle Zutaten bekannt');
  const en = library.filter(r => !energyCheck(r).ok);
  add('Energie-Plausibilität (Rezepte)', en.length === 0, en.length ? en.map(r => r.name).join(', ') : 'Alle plausibel');
  const ie = ingredientEnergyIssues();
  add('Energie-Plausibilität (Zutatenstamm)', ie.length === 0, ie.length ? ie.join(', ') : ZUTATEN.length + ' Zutaten geprüft');
  const zEx = ZUTATEN.filter(z => exclusionHits(z.name + ' ' + z.id, profile.excl).length);
  add('Ausschlüsse im Zutatenstamm', zEx.length === 0, zEx.length ? zEx.map(z => z.name).join(', ') : 'Keine Treffer');
  const noSteps = library.filter(r => !r.steps || r.steps.length < 3);
  add('Zubereitung vorhanden', noSteps.length === 0, '');
  const bad = library.filter(r => validateRecipe(r, library, null, null).fails > 0);
  add('Vollprüfung je Rezept', bad.length === 0, bad.length ? bad.map(r => r.name).join(', ') : 'Alle Rezepte ohne harte Fehler');
  return res;
}

/* Verteilung der Hauptmahlzeiten */
function distribution(library) {
  const main = library.filter(r => MAIN_MEALS.includes(r.meal));
  const out = {};
  GRUPPEN.forEach(g => { out[g] = main.filter(r => r.group === g).length; });
  return { total: main.length, byGroup: out };
}

/* Wochenplan-Berechnung */
function dayTotals(week, tag, byId) {
  const t = { kcal: 0, p: 0, c: 0, f: 0, n: 0 };
  SLOTS.forEach(([k]) => {
    const s = week[tag] && week[tag][k];
    if (s && s.rid && byId[s.rid]) {
      const pp = calcRecipe(byId[s.rid]).pp;
      t.kcal += pp.kcal; t.p += pp.p; t.c += pp.c; t.f += pp.f; t.n++;
    }
  });
  t.p = round1(t.p); t.c = round1(t.c); t.f = round1(t.f);
  return t;
}
function shoppingList(week, byId) {
  const agg = {};
  TAGE.forEach(tag => SLOTS.forEach(([k]) => {
    const s = week[tag] && week[tag][k];
    if (!s || !s.rid || s.fz || !byId[s.rid]) return;
    const r = byId[s.rid];
    (r.ing || []).forEach(([id, g]) => {
      if (!ZMAP[id]) return;
      agg[id] = (agg[id] || 0) + g / Math.max(1, r.servings || 1);
    });
  }));
  const groups = {};
  Object.keys(agg).forEach(id => {
    const z = ZMAP[id];
    (groups[z.cat] = groups[z.cat] || []).push({ id, name: z.name, g: agg[id], stk: z.stk });
  });
  Object.values(groups).forEach(a => a.sort((x, y) => x.name.localeCompare(y.name, 'de')));
  return KATS.filter(k => groups[k]).map(k => ({ cat: k, items: groups[k] }));
}
function fmtAmount(it) {
  let g = it.g;
  if (it.id === 'gewuerze') return 'nach Bedarf';
  g = g >= 100 ? Math.ceil(g / 5) * 5 : Math.ceil(g);
  if (it.stk) { const n = Math.max(1, Math.round(g / it.stk)); return n + ' Stk. (ca. ' + g + ' g)'; }
  return g >= 1000 ? (Math.round(g / 10) / 100).toString().replace('.', ',') + ' kg' : g + ' g';
}

/* Gefrierer */
function addMonths(iso, m) {
  const d = new Date(iso + 'T12:00:00'); d.setMonth(d.getMonth() + m); return d;
}
function expiry(item, today) {
  const e = item.exp ? new Date(item.exp + 'T12:00:00') : addMonths(item.date, item.months || 3);
  const t = new Date((today || new Date().toISOString().slice(0, 10)) + 'T12:00:00');
  const days = Math.round((e - t) / 86400000);
  return { date: e, days, state: days < 0 ? 'expired' : (days <= 14 ? 'soon' : 'ok') };
}
function invStats(inv) {
  let blocks = 0, ml = 0, comps = 0;
  inv.forEach(i => { blocks += i.count; ml += i.count * i.ml; if (i.ml >= 250) comps += i.count; });
  return { blocks, liters: Math.round(ml / 100) / 10, comps };
}

/* KI-Rezept: Prompt & Normalisierung */
function zutatenListeFuerPrompt() {
  return ZUTATEN.filter(z => !z.noMacro).map(z => z.id + ' = ' + z.name).join('\n') + '\ngewuerze = Gewürze & Kräuter (nur als Platzhalter, 2–15 g, ohne Nährwert)';
}
function normalizeAIRecipe(o) {
  if (!o || typeof o !== 'object') return null;
  const num = (v, d) => { const n = Number(v); return isFinite(n) ? n : d; };
  const fz = o.freeze || {};
  const r = {
    id: 'u' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36),
    name: String(o.name || '').trim().slice(0, 120),
    meal: MEALS.includes(o.meal) ? o.meal : 'Hauptgericht',
    group: GRUPPEN.includes(o.group) ? o.group : 'Vegetarisch',
    servings: Math.round(num(o.servings, 4)),
    prep: Math.round(num(o.prep, 15)), cook: Math.round(num(o.cook, 20)),
    level: ['leicht', 'mittel', 'anspruchsvoll'].includes(o.level) ? o.level : 'mittel',
    devices: Array.isArray(o.devices) ? o.devices.filter(d => GERAETE.includes(d)) : [],
    tags: Array.isArray(o.tags) ? o.tags.map(t => String(t).slice(0, 40)).slice(0, 8) : [],
    mp: !!(fz.ok === 'ja' || (o.tags || []).includes('Meal Prep')),
    ing: Array.isArray(o.ing) ? o.ing.map(x => [String(x[0]), num(x[1], 0)]) : [],
    steps: Array.isArray(o.steps) ? o.steps.map(s => String(s)).slice(0, 12) : [],
    tips: String(o.tips || ''), storage: String(o.storage || ''), reheat: String(o.reheat || ''),
    freeze: { ok: ['ja', 'eingeschränkt', 'nein'].includes(fz.ok) ? fz.ok : 'nein', block: [50, 125, 250, 500].includes(Number(fz.block)) ? Number(fz.block) : 0, months: Math.round(num(fz.months, 0)), note: String(fz.note || '') },
    ai: true, created: new Date().toISOString().slice(0, 10)
  };
  if (r.freeze.ok !== 'nein' && !r.freeze.block) { r.freeze.block = 500; }
  if (r.freeze.ok !== 'nein' && !r.freeze.months) { r.freeze.months = 3; }
  return r;
}

function validateBaustein(b, profile) {

  const badSp = (b.spices || []).filter(id => !SMAP[id]);

  add('Mengen positiv und plausibel', badAmt.length === 0, badAmt.length ? 'Auffällig: ' + badAmt.map(x => x[0]).join(', ') : '');
  const ex = recipeExclusionHits(b, profile && profile.excl);

  add('ID-Eindeutigkeit', new Set(BAUSTEINE.map(b => b.id)).size === BAUSTEINE.length, '');

function addListHtml() {

  if (a.mode === 'recent') {
    const rf = recentFoods(state.diary, todayIso(), 14);
    return rf.length ? rf.map(e => row(e.id, e.name, (e.kind === 'r' ? fmt(e.qty) + ' Port.' : Math.round(e.qty) + ' g') + ' · P ' + fmt(e.p), e.kcal, 'addrecent')).join('') : '<p class="note">Noch keine Einträge. Wähle ein Rezept oder eine Zutat.</p>';
  }
  if (a.mode === 'r') {
    const items = lib().filter(r => !(state.hideConf && conflicts(r, state.profile).length) && (!q || norm(r.name + ' ' + (r.cuisine || '') + ' ' + (r.tags || []).join(' ')).includes(q))).sort((x, y) => (state.favs.includes(y.id) - state.favs.includes(x.id)) || x.name.localeCompare(y.name, 'de')).slice(0, 40);
    return items.length ? items.map(r => { const pp = calcRecipe(r).pp; return row(r.id, (state.favs.includes(r.id) ? '★ ' : '') + r.name, fmt(qty) + ' Port. · P ' + fmt(pp.p * qty) + ' · ' + r.meal, Math.round(pp.kcal * qty), 'addrec'); }).join('') : '<p class="note">Nichts gefunden.</p>';

  if (a.mode === 'z') {
    const items = ZUTATEN.filter(z => !z.noMacro && !exTexts(z.name) && (!q || norm(z.name).includes(q))).slice(0, 40);
    return items.length ? items.map(z => { const n = nutriOfIng(z.id, gram); return row(z.id, z.name, gram + ' g · P ' + fmt(n.p) + ' · KH ' + fmt(n.c) + ' · F ' + fmt(n.f), n.kcal, 'addzut'); }).join('') : '<p class="note">Nichts gefunden.</p>';

  }
  return '';
}

/* ===== App: Rezepte, Rezeptdetail, Rezept-Editor ===== */
function cuisines() { return [...new Set(lib().map(r => r.cuisine).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de')); }
function filtered() {
  const f = ui.f, p = state.profile, q = norm(f.q), st = f.stock ? stockNow() : null;
  return lib().filter(r => {
    if (f.meal && r.meal !== f.meal) return false;
    if (f.group && r.group !== f.group) return false;
    if (f.dev && !(r.devices || []).includes(f.dev)) return false;
    if (f.cuisine && r.cuisine !== f.cuisine) return false;
    if (f.src === 'eigen' && !(r.user || r.ai)) return false;
    if (f.src === 'mit' && (r.user || r.ai)) return false;
    const pp = calcRecipe(r).pp;
    if (f.maxKcal && pp.kcal > Number(f.maxKcal)) return false;
    if (f.minP && pp.p < Number(f.minP)) return false;
    if (f.mp && !r.mp) return false;
    if (f.fz && !(r.freeze && r.freeze.ok && r.freeze.ok !== 'nein')) return false;
    if (f.fav && !state.favs.includes(r.id)) return false;
    if (f.saison && saisonOn()) { const sv = saisonVal(r, saisonMonth(), saisonOvNow()); if (!(sv != null && sv >= SAISON_SCHWELLE)) return false; }
    if (f.his !== '' && derive(r).his > Number(f.his)) return false;
    if (state.hideConf && conflicts(r, p).length) return false;
    if (st && coverage(r, r.servings, st).pct < 0.7) return false;
    if (q) {
      const hay = norm(r.name + ' ' + (r.cuisine || '') + ' ' + (r.tags || []).join(' ') + ' ' + r.ing.map(i => ZMAP[i[0]] ? ZMAP[i[0]].name : '').join(' '));
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function activeFilterCount() {

function goalBar(label, val, goal, unit, mode) {
  const pct = goal ? Math.min(100, Math.round(val / goal * 100)) : 0;
  let cls = 'ok', msg = '';

    const dev = goal ? (val - goal) / goal : 0;
    cls = Math.abs(dev) <= 0.1 ? 'ok' : (Math.abs(dev) <= 0.2 ? 'warn' : 'bad');
    msg = val ? (val - goal >= 0 ? '+' : '−') + Math.abs(Math.round(val - goal)) + ' ' + unit + ' zum Ziel' : '';
  } else { cls = val >= goal ? 'ok' : (val >= goal * 0.85 ? 'warn' : 'bad'); msg = val ? (val >= goal ? 'Ziel erreicht' : Math.round(goal - val) + ' ' + unit + ' fehlen') : ''; }
  if (!val) cls = '';
  return '<div class="stack-s" style="gap:4px"><div class="row between"><span class="lbl">' + label + '</span><span class="mono" style="font-size:13px">' + Math.round(val) + ' / ' + (mode === 'around' ? '≈ ' : '≥ ') + goal + ' ' + unit + '</span></div><div class="bar"><i class="' + cls + '" style="width:' + pct + '%"></i></div><span class="note">' + msg + '</span></div>';
}

function viewKochen() {
  const stock = stockNow(), has = Object.keys(stock).length > 0, min = ui.cookMin;
  const res = has ? whatCanICook(lib(), stock, state.spices, state.profile, min).slice(0, 25) : [];
  const soon = expiringSoon(state.stock, todayIso(), 3).filter(l => lotState(l, todayIso()).state !== 'expired');
  const ideas = {};
  soon.forEach(l => {
    const rs = lib().filter(r => r.ing.some(i => i[0] === l.ing) && !conflicts(r, state.profile).length).map(r => ({ r, c: coverage(r, r.servings, stock).pct })).sort((a, b) => b.c - a.c).slice(0, 2);
    if (rs.length) ideas[l.ing] = rs;
  });
  return '<h2>Was kann ich kochen?</h2>' + (!has ? '<div class="panel stack-s"><p class="note">Erfasse zuerst Zutaten unter „Zutaten“. Dann zeigt die App, welche Rezepte du mit deinem Vorrat kochen kannst und was dir fehlt.</p><button type="button" class="btn primary" data-act="subvorrat" data-v="zutaten">Zu den Zutaten</button></div>' :
    '<div class="chips">' + [[0.5, 'ab 50 %'], [0.7, 'ab 70 %'], [0.9, 'ab 90 %'], [0.999, 'komplett']].map(([v, n]) => '<button type="button" class="chip ' + (min === v ? 'on' : '') + '" data-act="cookmin" data-v="' + v + '">' + n + '</button>').join('') + '</div>' +
    (Object.keys(ideas).length ? '<div class="panel stack-s"><h3>Zuerst verwerten</h3>' + Object.keys(ideas).slice(0, 5).map(id => '<div><div class="lbl">' + esc(ZMAP[id].name.split(' (')[0]) + ' läuft bald ab</div>' + ideas[id].map(x => '<button type="button" class="srow" data-act="open" data-id="' + esc(x.r.id) + '"><div class="grow ename">' + esc(x.r.name) + '</div><span class="badge">' + Math.round(x.c * 100) + ' %</span></button>').join('') + '</div>').join('') + '</div>' : '') +
    (res.length ? '<div class="list">' + res.map(x => '<article class="rcard" data-act="open" data-id="' + esc(x.r.id) + '"><div class="rtop"><h3>' + esc(x.r.name) + '</h3><span class="badge ' + (x.cov.pct >= 0.999 ? 'ok' : '') + '">' + Math.round(x.cov.pct * 100) + ' %</span></div><div class="bar"><i class="' + (x.cov.pct >= 0.9 ? 'ok' : '') + '" style="width:' + Math.round(x.cov.pct * 100) + '%"></i></div>' +
      (x.cov.missing.length ? '<div class="note">Fehlt: ' + esc(x.cov.missing.slice(0, 5).map(m => m.name.split(' (')[0]).join(', ')) + (x.cov.missing.length > 5 ? ' u. a.' : '') + '</div>' : '<div class="note" style="color:var(--ok)">Alle Zutaten da' + (x.sp.miss.length ? ', Gewürze fehlen: ' + esc(x.sp.miss.slice(0, 3).map(i => SMAP[i].name).join(', ')) : '') + '</div>') + '</article>').join('') + '</div>' : '<div class="panel note">Kein Rezept erreicht diese Deckung. Wähle eine niedrigere Schwelle oder buche mehr Zutaten ein.</div>') +

}

/* Heute: Karte mit frischen Zutaten und Rezeptideen */
function saisonPicks(n, m) {

  if (!pool.length) return [];
  const day = Math.floor(new Date(todayIso() + 'T12:00:00Z').getTime() / 86400000);
  const favs = pool.filter(x => state.favs.includes(x.r.id)), rest = pool.filter(x => !state.favs.includes(x.r.id));
  const out = []; const start = (day * 7) % Math.max(1, rest.length);
  for (let i = 0; i < rest.length && out.length < n; i++) out.push(rest[(start + i) % rest.length]);
  const f = favs.length ? [favs[day % favs.length]] : [];

}

  return seg(PREP_SUBS, s, 'subprep') + intro + ({ start: prepStart, katalog: prepKatalog, bauen: prepBauen, session: prepSession })[s]();
}

/* ---------- Start: Soll und Ist, Startprogramm, Lager ---------- */
function prepStart() {
  const P = prepSt(), soll = sollBestand(P.weeks, P.perWeek, P.guests), ist = istBestand(state.inv), rnd = prepRoundsFor(soll.soll);
  const rows = PREP_KEYS.map(k => {
    const have = ist[k] || 0, want = soll.soll[k] || 0, pct = want ? Math.min(100, Math.round(have / want * 100)) : 0;
    return '<div class="mrow"><div class="row between"><span class="lbl">' + (k === 'Komplett' ? 'Komplettgerichte' : k) + ' <span class="note">(' + KEY_ML[k] + ')</span></span><span class="mono" style="font-size:12.5px">' + have + ' / ' + want + '</span></div><div class="bar"><i class="' + (have >= want ? 'ok' : '') + '" style="width:' + pct + '%"></i></div></div>';
  }).join('');
  const sel = (id, k, vals, cur, fmtv) => '<div class="field"><label for="' + id + '">' + k + '</label><select id="' + id + '" data-chg="prepset" data-k="' + id + '">' + vals.map(v => '<option value="' + v + '" ' + (Number(cur) === v ? 'selected' : '') + '>' + fmtv(v) + '</option>').join('') + '</select></div>';
  const prog = STARTPROGRAMM.map((sp, i) => {
    const plan = sp.ids.map(([id, n]) => ({ k: 'b', id, n }));
    const y = sessionYield(plan, libMap());
    return '<div class="panel stack-s"><div class="row between"><h3>' + esc(sp.t) + '</h3><span class="badge ice">' + y.rounds + (y.rounds === 1 ? ' Runde' : ' Runden') + '</span></div><p class="note" style="color:var(--ink)">' + esc(sp.text) + '</p>' +
      '<div class="note mono">' + y.blocks + ' Blöcke · ' + fmt(y.liters) + ' Liter · ca. ' + Math.round(y.wallMin / 60 * 10) / 10 + ' Std. Küchenzeit</div>' +
      '<button type="button" class="btn" data-act="prepprog" data-i="' + i + '">In die Session übernehmen</button></div>';
  }).join('');
  const dr = SCHUBLADEN[P.drawers] || SCHUBLADEN[6];
  const drawers = '<table><thead><tr><th>Fach</th><th>Inhalt</th><th class="n">Bestand</th></tr></thead><tbody>' + dr.map(([n, name, keys]) => {
    const cnt = keys.reduce((a, k) => a + (ist[k] || 0), 0);
    return '<tr><td>' + n + '</td><td>' + esc(name) + '</td><td class="n mono">' + cnt + '</td></tr>';
  }).join('') + '</tbody></table>';
  const last = P.log.length ? P.log[P.log.length - 1] : null;
  return '<h2>Modular Freezer Meal Prep</h2>' +
    '<div class="panel ice stack-s"><p style="color:var(--ink)">Du kochst in Chargen einzelne Bausteine (Protein, Beilage, Sauce, Gemüse, Booster), frierst sie in Blöcken ein und setzt später jede Mahlzeit in wenigen Minuten aus Blöcken zusammen. Dazu kommen komplette Gerichte für den Alltag und Besuchs-Sets.</p>' +
    '<p class="note" style="color:var(--ink)">Module: Protein 250 ml · Beilage 250 ml · Sauce 125 ml · Gemüse 250 oder 500 ml · Booster 50 ml. Dips und Grillsaucen liegen im Modul Sauce, Marinaden und Dressings im Modul Booster; im Katalog filterst du sie über „Art“.</p></div>' +
    '<div class="panel stack-s"><h3>Ziel und Bestand</h3><div class="grid3">' +
    sel('weeks', 'Wochen', [1, 2, 3, 4, 6, 8, 12], P.weeks, v => v) +
    sel('perWeek', 'Mahlz./Woche', [3, 5, 7, 10, 14, 21], P.perWeek, v => v) +
    sel('guests', 'Besuchs-Sets', [0, 1, 2, 3], P.guests, v => v) + '</div>' + rows +
    '<p class="note">Zielbestand: ' + soll.meals + ' Mahlzeiten. ' + esc(soll.lines.join('. ')) + '. Etwa ' + soll.bigBlocks + ' größere Blöcke (ab 250 ml). Dafür brauchst du rund ' + rnd.rounds + ' Formen-Runden insgesamt.</p>' +
    '<p class="note">Der Bestand zählt Blöcke im Gefrierer, die du über eine Session einbuchst oder im Vorrat unter „Gerichte“ mit Modul-Bezug einträgst. Ältere Einträge ohne Modul zählen nur bei Rezepten ab 250 ml als Komplettgericht.</p></div>' +
    '<h2>Startprogramm</h2><p class="note">Vier Sessions bauen einen Grundstock auf. Jede passt in ein bis drei Formen-Runden. Die Zeiten sind Richtwerte.</p>' + prog +
    '<div class="panel stack-s"><div class="row between"><h3>Schubladen</h3><div class="row">' + [5, 6, 7].map(n => '<button type="button" class="chip ' + (P.drawers === n ? 'on' : '') + '" data-act="prepdrawers" data-v="' + n + '">' + n + ' Fächer</button>').join('') + '</div></div>' + drawers +
    '<p class="note">Ältere Beutel nach vorn, neue nach hinten (First in, first out).</p></div>' +
    '<details class="panel" ' + openAttr('prepprot') + '><summary><span>Sicherheit und Ablauf beim Einfrieren</span></summary><div class="stack-s"><ul class="plain">' + FREEZE_REGELN.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul></div></details>' +
    '<details class="panel" ' + openAttr('prepfmt') + '><summary><span>Formen und Etiketten</span></summary><div class="stack-s"><table><thead><tr><th>Größe</th><th class="n">Formen</th><th class="n">Kammern</th><th class="n">pro Runde</th></tr></thead><tbody>' + FORMEN_TEXT.map(x => '<tr><td>' + x.ml + ' ml</td><td class="n">' + x.formen + '</td><td class="n">' + x.kammern + '</td><td class="n">' + KAMMERN[x.ml] + '</td></tr>').join('') + '</tbody></table>' +
    '<p><b>Etikett</b> auf Malerkrepp mit wasserfestem Marker:</p><pre class="pre label">' + esc(etikett({ name: 'Hähnchen-Geschnetzeltes', ml: 250, count: 5, date: todayIso(), exp: addMonthsStr(todayIso(), 3) })) + '</pre><p class="note">Eine Runde braucht je nach Gefrierer etwa 8 bis 12 Stunden bis zum Durchfrieren. Mehrere Runden verteilst du auf mehrere Tage oder tauschst die Formen nach dem Entnehmen.</p></div></details>' +
    (last ? '<p class="note mono">Letzte Session: ' + esc(last.date) + ' · ' + last.blocks + ' Blöcke · ' + fmt(last.liters) + ' Liter</p>' : '');
}

/* ---------- Katalog ---------- */
function prepKatalog() {
  const f = ui.pk, q = norm(f.q || '');

  const typChips = [['', 'Alle Arten'], ['Dip', 'Dips'], ['Grillsauce', 'Grillsaucen'], ['Marinade', 'Marinaden'], ['Dressing', 'Dressings']].map(([k, n]) => '<button type="button" class="chip ' + ((f.typ || '') === k ? 'on' : '') + '" data-act="pktyp" data-v="' + k + '">' + n + '</button>').join('');
  let list = BAUSTEINE.filter(b => (!f.mod || b.mod === f.mod) && (!f.typ || b.typ === f.typ) && (!q || norm(b.name + ' ' + b.group + ' ' + b.cuisine).includes(q)));
  if (state.hideConf) list = list.filter(isUsable);
  const hidden = BAUSTEINE.filter(b => (!f.mod || b.mod === f.mod) && (!f.typ || b.typ === f.typ)).length - list.length;
  const cards = list.map(b => {
    const d = derive(b);
    return '<article class="rcard" data-act="openb" data-id="' + b.id + '" tabindex="0"><div class="row between"><b>' + esc(b.name) + '</b><span class="badge ice">' + b.ml + ' ml</span></div>' +
      '<div class="note mono">' + cubeLine(b) + ' je Block</div>' +
      '<div class="badges"><span class="badge">' + b.mod + '</span><span class="badge">' + esc(b.group) + '</span><span class="badge">' + b.n + ' Blöcke je Charge</span>' + (b.style !== 'neutral' ? '<span class="badge">' + esc(STIL_NAME[b.style]) + '</span>' : '') + '<span class="badge">Histamin ' + d.hisLabel + '</span></div></article>';
  }).join('');
  return '<h2>Katalog der Bausteine</h2><div class="field"><label for="pkq">Suche</label><input type="search" id="pkq" data-inp="pkq" value="' + esc(f.q) + '" placeholder="z. B. Reis, Curry, Hähnchen"></div><div class="chips">' + chips + '</div><div class="chips">' + typChips + '</div>' +
    '<p class="note">' + list.length + ' Bausteine. Nährwerte je Block, berechnet aus den Zutaten der ganzen Charge geteilt durch die geschätzte Blockanzahl.' + (hidden ? ' ' + hidden + ' wegen deines Profils ausgeblendet.' : '') + '</p>' +
    '<div class="list">' + (cards || '<div class="panel note">Nichts gefunden.</div>') + '</div>';
}

    '<div class="badges"><span class="badge ' + (v.fails ? 'bad' : '') + '">' + (v.fails ? 'Prüfung nicht bestanden' : 'Entwurf · automatisch validiert') + '</span><span class="badge">' + b.mod + '</span><span class="badge">' + esc(b.group) + '</span>' + (b.cuisine ? '<span class="badge ice">' + esc(b.cuisine) + '</span>' : '') + '</div>' +
    (cf.length ? '<div class="panel" style="background:var(--bad-bg);border-color:transparent"><b class="err">Konflikt mit deinem Profil</b><div class="note">' + cf.map(esc).join('<br>') + '</div></div>' : '') +

    ((b.devices || []).length ? '<div class="panel"><div class="lbl">Geräte</div><div class="badges" style="margin-top:6px">' + b.devices.map(x => '<span class="badge">' + esc(x) + '</span>').join('') + '</div></div>' : '') +
    '<div class="panel ice stack-s"><h3>Einfrieren, Auftauen, Erhitzen</h3><p><b>Einfrieren:</b> ' + b.ml + ' ml Blöcke, bis ca. ' + b.months + ' Monate (Qualitätsrichtwert).</p><p class="note" style="color:var(--ink)"><b>Auftauen:</b> ' + esc(b.thaw) + '</p><p class="note" style="color:var(--ink)"><b>Erhitzen:</b> ' + esc(b.reheat) + '</p><p class="note" style="color:var(--ink)">' + esc(b.storage) + '</p></div>' +

    '<details class="panel" ' + openAttr('bchk') + '><summary><span>Automatische Prüfung (' + v.checks.filter(c => c.level === 'ok').length + ' von ' + v.checks.length + ' bestanden)</span></summary>' + checksBlock(v) + '<p class="note">Ausbeute und Blockanzahl sind Schätzungen, nicht gemessen. Praktisch getestet ist der Baustein erst, wenn du ihn gekocht hast.</p></details>' +

/* ---------- Bauen ---------- */

      opts.map(b => '<option value="' + b.id + '" ' + (cur === b.id ? 'selected' : '') + '>' + esc(b.name) + (b.ml !== m.ml ? ' (' + b.ml + ' ml)' : '') + '</option>').join('') + '</select>' +
      '<select aria-label="Anzahl Blöcke ' + m.id + '" data-chg="pbq" data-k="' + m.id + '" style="width:64px">' + [1, 2, 3].map(n => '<option ' + (qn === n ? 'selected' : '') + ' value="' + n + '">' + n + '×</option>').join('') + '</select></div></div>';
  }).join('');
  const hasSel = Object.keys(sel).some(k => sel[k]);

    '<div class="note mono">' + m.parts.reduce((a, x) => a + x.n, 0) + ' Blöcke · ' + m.tot.ml + ' ml · ' + (g.kcal ? Math.round(m.tot.kcal / g.kcal * 100) + ' % deines Tagesziels' : '') + '</div>' +
    prepAllergBadges(m.al, m.intol) + '<p class="note">Histamin-Risikoprofil: ' + m.hisLabel + '.</p>' +
    (m.conflicts.length ? '<div class="panel" style="background:var(--bad-bg);border-color:transparent"><b class="err">Konflikt mit deinem Profil</b><div class="note">' + m.conflicts.map(esc).join('<br>') + '</div></div>' : '') +
    (m.notes.length ? '<div class="panel warnp"><div class="note" style="color:var(--ink)">' + m.notes.map(esc).join('<br>') + '</div></div>' : '') +
    '<p class="note">Aufwärmen: Blöcke zusammen in einen Topf oder in ein geschlossenes Gefäß geben, auftauen und durchgehend auf mind. 70 °C erhitzen. Sauce und Booster erst zum Schluss unterrühren.</p>' +
    '<div class="grid2"><div class="field"><label for="pbs">Eintragen als</label><select id="pbs" data-chg="pbslot">' + SLOTS.map(([k, n]) => '<option value="' + k + '" ' + (pb.slot === k ? 'selected' : '') + '>' + n + '</option>').join('') + '</select></div><div class="field"><label>&nbsp;</label><button type="button" class="btn primary" data-act="pbdiary">Ins Tagebuch</button></div></div>' +
    '<button type="button" class="btn ghost" data-act="pbclear">Auswahl leeren</button></div>';
  const sug = suggestMeals(state.profile).slice(0, 6).map((x, i) => '<div class="panel stack-s"><b>' + esc(x.name) + '</b><div class="note mono">' + Math.round(x.m.tot.kcal) + ' kcal · P ' + fmt(x.m.tot.p) + ' g · ' + x.m.tot.ml + ' ml</div><button type="button" class="btn small" data-act="pbuse" data-i="' + i + '">Übernehmen</button></div>').join('');
  return '<h2>Mahlzeit bauen</h2><p class="note">Setze aus deinen Blöcken eine Mahlzeit zusammen. Die Summen kommen aus den Nährwerten der Bausteine.</p>' + fields + sum +
    '<h3 style="margin-top:6px">Vorschläge mit viel Eiweiß</h3><p class="note">Stimmige Kombinationen aus dem Katalog, sortiert nach Eiweiß je Kalorie. Sie berücksichtigen dein Profil.</p><div class="list">' + (sug || '<div class="panel note">Mit deinem Profil gibt es keine passenden Kombinationen.</div>') + '</div>';
}

/* ---------- Session ---------- */

  }
  const tl = plan.length ? '<div class="panel stack-s"><h3>Ablauf</h3><ol class="steps">' + sessionTimeline(plan, by).map(s => '<li><b>' + esc(s.t) + ':</b> ' + esc(s.text) + '</li>').join('') + '</ol></div>' : '';
  const done = plan.length ? '<div class="panel stack-s"><h3>Session abschließen</h3><p class="note">Bucht alle Blöcke in den Gefrierer ein und zieht die Zutaten vom Vorrat ab, soweit vorhanden. Was fehlt, wird einfach nicht abgezogen.</p><div class="row"><button type="button" class="btn primary" data-act="prepdone">' + (ui.confirm === 'prepdone' ? 'Wirklich einbuchen?' : 'Blöcke einbuchen') + '</button><button type="button" class="btn danger" data-act="prepclear">' + (ui.confirm === 'prepclear' ? 'Wirklich leeren?' : 'Plan leeren') + '</button></div></div>' : '';
  const log = P.log.length ? '<details class="panel" ' + openAttr('plog') + '><summary><span>Frühere Sessions (' + P.log.length + ')</span></summary><div class="stack-s">' + P.log.slice().reverse().map(l => '<div class="note mono">' + esc(l.date) + ' · ' + l.blocks + ' Blöcke · ' + fmt(l.liters) + ' Liter<br>' + esc(l.names.join(', ')) + '</div>').join('') + '</div></details>' : '';
  return '<h2>Session planen</h2><p class="note">Stelle Chargen zusammen, kaufe ein, koche und buche die Blöcke danach in den Gefrierer ein.</p>' +
    '<div class="panel stack-s">' + addB + addR + '</div>' +
    (plan.length ? '<div class="list">' + items + '</div>' : '<div class="panel note">Noch leer. Füge Bausteine oder Komplettgerichte hinzu oder übernimm ein Startprogramm unter „Start“.</div>') + sum + shop + tl + done + log;
}

/* ---------- Aktionen ---------- */
function prepToast(msg) { toast(msg); }
Object.assign(ACT, {
  subprep(el) { ui.sub.prep = el.dataset.v; render(); window.scrollTo(0, 0); },
  prepdrawers(el) { state.prep.drawers = Number(el.dataset.v); save(); render(); },
  prepprog(el) {
    const sp = STARTPROGRAMM[Number(el.dataset.i)]; if (!sp) return;
    sp.ids.forEach(([id, n]) => { const ex = state.prep.plan.find(x => x.k === 'b' && x.id === id); if (ex) ex.n = Math.min(6, ex.n + n); else state.prep.plan.push({ k: 'b', id, n }); });
    save(); ui.sub.prep = 'session'; render(); window.scrollTo(0, 0); toast('Startprogramm in die Session übernommen');
  },
  pkmod(el) { ui.pk.mod = el.dataset.v; render(); },
  pktyp(el) { ui.pk.typ = el.dataset.v; render(); },
  openb(el) { openSheet({ type: 'baustein', id: el.dataset.id }); },
  padd(el) {
    const k = el.dataset.k; let id = el.dataset.id;
    if (!id) { const s = $(k === 'b' ? '#pab' : '#par'); id = s ? s.value : ''; }
    if (!id) { toast('Bitte zuerst etwas auswählen'); return; }
    const P = state.prep, ex = P.plan.find(x => x.k === k && x.id === id);
    if (ex) ex.n = Math.min(6, ex.n + 1); else P.plan.push({ k, id, n: 1 });
    save(); if (ui.sheet) { ui.sheet = null; ui.sub.prep = 'session'; } render(); toast('In der Session');
  },
  prem(el) { const y = sessionYield(state.prep.plan, libMap()); const e = y.items[Number(el.dataset.i)]; if (e) state.prep.plan = state.prep.plan.filter(x => x !== e.it); save(); render(); },
  pdec(el) { const y = sessionYield(state.prep.plan, libMap()); const e = y.items[Number(el.dataset.i)]; if (e && e.it.n > 1) { e.it.n -= 1; save(); render(); } },
  pinc(el) { const y = sessionYield(state.prep.plan, libMap()); const e = y.items[Number(el.dataset.i)]; if (e && e.it.n < 6) { e.it.n += 1; save(); render(); } },
  prepclear() { if (!confirmed('prepclear')) { render(); return; } state.prep.plan = []; state.prep.checked = {}; save(); render(); toast('Plan geleert'); },
  pshopcopy() {
    const P = state.prep, sp = prepShopping(P.plan, libMap(), stockNow(), state.spices);
    const lines = ['Einkauf Meal-Prep-Session'];
    sp.list.forEach(g => { lines.push('', g.cat + ':'); g.items.forEach(it => lines.push('- ' + it.name.split(' (')[0] + ': ' + fmtGrams({ g: it.g, stk: it.stk }))); });
    if (sp.spices.length) lines.push('', 'Gewürze prüfen: ' + sp.spices.map(s => s.name).join(', '));
    copyText(lines.join('\n'), 'Einkaufsliste kopiert');
  },
  prepdone() {
    if (!confirmed('prepdone')) { render(); return; }
    const P = state.prep, by = libMap(); if (!P.plan.length) return;
    const bk = bookSession(P.plan, by, state.stock, todayIso());
    state.stock = bk.lots;
    bk.items.forEach(n => {
      const ex = state.inv.find(i => i.name === n.name && (i.ml || 0) === n.ml && i.date === n.date && (i.loc || 'Gefrierer') === 'Gefrierer' && (i.bid || '') === (n.bid || '') && (i.rid || '') === (n.rid || ''));
      if (ex) ex.count += n.count; else state.inv.push(n);
    });
    const y = sessionYield(P.plan, by);
    P.log.push({ date: todayIso(), blocks: y.blocks, liters: y.liters, names: bk.items.map(i => i.name) });
    P.log = P.log.slice(-40); P.plan = []; P.checked = {};
    save(); render(); toast(y.blocks + ' Blöcke eingebucht');
  },
  pbclear() { ui.pb.sel = {}; ui.pb.q = {}; render(); },
  pbuse(el) { const x = suggestMeals(state.profile).slice(0, 6)[Number(el.dataset.i)]; if (!x) return; ui.pb.sel = Object.assign({}, x.sel); ui.pb.q = {}; render(); window.scrollTo(0, 0); },
  pbdiary() {
    const pb = ui.pb, m = mealBuild(Object.assign({}, pb.sel, { q: pb.q }), state.profile);
    if (!m.parts.length) { toast('Wähle zuerst Bausteine aus'); return; }
    logEntry(entryQuick(mealName(pb.sel).slice(0, 80), m.tot.kcal, m.tot.p, m.tot.c, m.tot.f, pb.slot), ui.date);
    save(); toast('Ins Tagebuch eingetragen (' + (SLOT_NAME[pb.slot] || '') + ')');
  }
});
Object.assign(CHG, {
  prepset(el) { const k = el.dataset.k; state.prep[k] = Number(el.value); save(); render(); },
  pbsel(el) { ui.pb.sel[el.dataset.k] = el.value; render(); },
  pbq(el) { ui.pb.q[el.dataset.k] = Number(el.value); render(); },
  pbslot(el) { ui.pb.slot = el.value; },
  pasel() { /* Auswahl wird beim Hinzufügen aus dem Feld gelesen */ },
  pshop(el) { if (el.checked) state.prep.checked[el.dataset.k] = true; else delete state.prep.checked[el.dataset.k]; save(); render(); }
});
Object.assign(INP, { pkq(el) { ui.pk.q = el.value; render(); const i = $('#pkq'); if (i) { i.focus(); try { i.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* ignorieren */ } } } });
initRuntime();

</script>
